<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superhost Radar — Tracker de Critérios | Praia Digital</title><meta name="description" content="Acompanhe os 4 critérios do Superhost Airbnb e veja exatamente o que falta para o selo."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fdeef0,#fdf7ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #ff5a5f22}h1{color:#e0484e;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input{width:100%;padding:.6rem;border:2px solid #f6d9db;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#ff5a5f;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#fdeef0;border-radius:12px;padding:1rem}.ok{color:#2e8b57}.falta{color:#c0392b}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#e0484e;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/reputacao">Reputação</a> · <a href="https://praia.digital/ranking-anfitrioes">Ranking Anfitriões</a> · <a href="https://praia.digital/kit-boas-vindas">Kit Boas-Vindas</a></nav><div class="card"><h1>🦸 Superhost Radar</h1><p>O selo aumenta reservas em até 20%. Veja o que falta:</p><label>Nota geral atual (0–5)</label><input id="n" type="number" step="0.01" value="4.7"><label>Taxa de resposta (%)</label><input id="r" type="number" value="92"><label>Taxa de cancelamento (%)</label><input id="c" type="number" value="1"><label>Estadias concluídas nos últimos 12 meses</label><input id="e" type="number" value="8"><button onclick="calc()">Verificar critérios</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const crit=[['Nota ≥ 4,8',g('n')>=4.8,`atual ${g('n')} — melhore com <a href="https://praia.digital/kit-boas-vindas">Kit Boas-Vindas</a>`],['Resposta ≥ 90%',g('r')>=90,`atual ${g('r')}% — responda em <1h com mensagens prontas do <a href="https://praia.digital/checkin-express">Check-in Express</a>`],['Cancelamento < 1%',g('c')<1,`atual ${g('c')}% — simule políticas no <a href="https://praia.digital/taxa-cancelamento">Taxa de Cancelamento</a>`],['≥ 10 estadias/ano',g('e')>=10,`atual ${g('e')} — faltam ${Math.max(0,10-g('e'))}; acelere com <a href="https://praia.digital/pacote-fds">Pacote FDS</a>`]];let ok=0,html='';crit.forEach(([n,p,d])=>{if(p)ok++;html+=`<p class="${p?'ok':'falta'}">${p?'✅':'❌'} <b>${n}</b>${p?'':' — '+d}</p>`});document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=html+`<p style="margin-top:.8rem;font-size:1.05rem"><b>${ok}/4 critérios</b> ${ok===4?'🏆 Você já pode ser Superhost!':'— foco nos ❌ até a próxima avaliação trimestral.'}</p>`}</script></body></html>
